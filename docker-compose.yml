services:
  landdiff:
    build: .
    image: landdiff:latest
    container_name: landdiff
    restart: unless-stopped

    # Chromium кладёт свои буферы в /dev/shm, а по умолчанию его 64 МБ:
    # на тяжёлых лендингах вкладка падает молча, посреди снимка.
    shm_size: 1gb

    # Зигота Chromium переживает закрытие браузера и достаётся PID 1, а он у
    # нас — прикладной процесс, который не пожинает сирот: без init зомби
    # копятся по два на прогон. Заодно tini доносит SIGTERM до службы, чтобы
    # та успела снять лок.
    init: true

    volumes:
      # Скриншоты и baseline лежат в каталоге проекта: их видно на месте,
      # можно открыть любым просмотрщиком, не поднимая контейнер.
      - ./data:/app/data
      # Список лендингов правится снаружи и перечитывается на каждом прогоне —
      # добавление нового лендинга не требует перезапуска.
      - ./landings.yaml:/app/landings.yaml:ro

    env_file:
      - .env

    environment:
      TZ: ${TZ:-UTC}
      # Секреты приходят файлами, а не значениями: в окружении процесса и в
      # docker inspect остаётся только путь. Сами файлы — в блоке secrets ниже.
      TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_token
      SMTP_PASS_FILE: /run/secrets/smtp_pass

    secrets:
      - telegram_token
      - smtp_pass

    # Служба только открывает исходящие соединения и пишет в свой volume:
    # ни одна capability ей не нужна.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
      # Sandbox Chromium изолирует renderer через user namespaces, а дефолтный
      # seccomp-профиль Docker запрещает CLONE_NEWUSER всем без CAP_SYS_ADMIN —
      # то есть и нам с cap_drop: ALL. Профиль ниже — тот же дефолтный, плюс
      # разрешение создавать user namespace; всё остальное закрыто как было.
      # Уберёте его — браузер не запустится вовсе (см. capture.ts).
      - seccomp=./seccomp-chromium.json

    # Границы на случай тяжёлой или враждебной страницы: без них вкладка,
    # съевшая всю память, утащит за собой хост. Потолок процессов заодно
    # ловит утечку, если однажды снова начнут копиться зиготы.
    mem_limit: 3g
    pids_limit: 512

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  telegram_token:
    file: ./secrets/telegram_token
  smtp_pass:
    file: ./secrets/smtp_pass
