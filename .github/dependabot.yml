version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Группа намеренно ограничена minor и patch. Без этого ограничения
      # dependabot складывал в один PR мажорные скачки сразу нескольких
      # пакетов (typescript 5 -> 7 вместе с @types/node 22 -> 26), и при
      # поломке пришлось бы расщеплять PR вручную, чтобы понять виновника.
      # Мажорные версии теперь приезжают по одной.
      dev-and-types:
        patterns:
          - "@types/*"
          - typescript
          - tsx
        update-types:
          - minor
          - patch
    ignore:
      # playwright исключён ЦЕЛИКОМ, а не только по мажорным версиям.
      #
      # Путь к браузеру привязан к номеру ревизии: playwright 1.62.1 идёт в
      # /ms-playwright/chromium-1234, и этот каталог кладёт в образ его тег в
      # Dockerfile. Любое обновление пакета — хоть патч — рассинхронизирует
      # пару, и браузер перестаёт запускаться.
      #
      # Коварство в том, что автоматический PR правит только package.json.
      # Сборка образа при этом проходит, тесты проходят (браузер они не
      # поднимают), CI зелёный — а служба после развёртывания не стартует.
      # Версия меняется только вручную и только вместе с тегом и digest.
      - dependency-name: playwright

  # Docker: подскажет, когда у закреплённого тега появится новый digest.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  # Сами экшены в CI тоже стареют и тоже пиннятся.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
