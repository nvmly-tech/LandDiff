name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Раз в неделю без изменений в коде: уязвимость в зависимости появляется
  # сама по себе, без единого коммита с нашей стороны.
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ci, а не install: ставит ровно то, что записано в package-lock.json.
      # Браузер не нужен — тесты работают на заглушках и на фикстурах.
      - name: Установка зависимостей
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1

      - name: Проверка типов
        run: npm run typecheck

      - name: Тесты
        run: npm test

      # Не блокирует сборку: свежая уязвимость в транзитивной зависимости не
      # повод останавливать работу над кодом, но знать о ней надо.
      - name: Аудит зависимостей
        run: npm audit --omit=dev
        continue-on-error: true

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Сборка образа
        run: docker build -t landdiff:ci .

      # Сборки мало. Три вещи ломаются молча и не видны ни сборке, ни тестам:
      # рассинхрон версии playwright с ревизией браузера в образе, отключённый
      # sandbox и сломанное извлечение содержимого через page.evaluate. Проба
      # проходит настоящий путь съёмки теми же флагами и профилем seccomp,
      # что и docker-compose. Запуск через tsx: проба импортирует наш capture.ts.
      - name: Образ работоспособен — sandbox и извлечение
        run: |
          docker run --rm \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --security-opt seccomp=./seccomp-chromium.json \
            --shm-size 1g \
            -v "$PWD/scripts/smoke.mjs:/app/smoke.mjs:ro" \
            -w /app landdiff:ci \
            node --import tsx smoke.mjs
