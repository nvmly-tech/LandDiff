# Скопируйте в landings.yaml и правьте руками — сервис перечитывает файл
# на каждом прогоне, перезапуск не нужен.
#
# Всё из defaults подставляется в каждый лендинг. Списки ignoreSelectors и
# ignorePatterns складываются с теми, что заданы в самом лендинге; остальные
# поля лендинг перекрывает целиком.

defaults:
  viewport:
    width: 1440
    height: 900

  # Пауза после загрузки и прокрутки — даём отрисоваться шрифтам и картинкам.
  settleMs: 1500

  # Найдя изменение, переснять страницу и сравнить снимки между собой.
  # Расходится — значит на странице просто динамика, уведомление не шлём.
  confirm: true
  confirmDelayMs: 20000

  # Узлы, которые скрываются перед снимком. Сюда — всё, что живёт своей
  # жизнью: баннеры согласия, чаты поддержки, тикеры, счётчики онлайна.
  ignoreSelectors:
    - "#cookie-banner"
    - ".cookie-consent"
    - ".chat-widget"
    - "[data-nosnippet]"

  # Куски текста, которые вырезаются из снапшота перед сравнением.
  # Регулярные выражения JavaScript, флаги g и i добавляются автоматически.
  ignorePatterns:
    - "\\d{2}:\\d{2}(:\\d{2})?"
    - "csrf[-_]?token"

  # Куда слать: email, telegram или оба.
  notify:
    - email
    - telegram

  emailTo:
    - you@example.com

landings:
  - name: Главный лендинг
    url: https://example.com/

  - name: Лендинг акции
    url: https://example.com/promo
    # Следить только за содержимым контейнера, остальное игнорировать.
    region: "main"
    # Не снимать, пока не появится этот узел.
    waitForSelector: ".hero__title"
    ignoreSelectors:
      - ".countdown"
    # Этот лендинг шлёт только в телеграм и в отдельный чат.
    notify:
      - telegram
    telegramChatId: "-1001234567890"

  - name: Старый лендинг
    url: https://example.com/old
    # Временно снят с мониторинга, но конфиг сохранён.
    enabled: false
